<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lars Monsen Inventory</title>
    <link rel="stylesheet" href="style-grid-backpack.css"/>
    <link rel="stylesheet" href="style-grid-available-items.css"/>

    
</head>
<body>
    <h1 style="">Pakk sekken til Lars!</h1>
    <!--<h2>Fyll opp sekken din:</h2>-->
    
    
    <div id="myInventory" class="grid-sekk">
        <div id="rute0" class="item"></div>
        <div id="rute1" class="item"></div>
        <div id="rute2" class="item"></div>
        <div id="rute3" class="item"></div>
        <div id="rute4" class="item"></div>
        <div id="rute5" class="item"></div>
        <div id="rute6" class="item"></div>
        <div id="rute7" class="item"></div>
        <div id="rute8" class="item"></div>
        
    </div>

    <button style="background-color: #f75260;" onclick="tømSekk()">Destroy items in bag</button>
    <button style="background-color: #5cbb5c;" onclick="erDuKlar()">Klar for tur!</button>
    
    <h2> Meny </h2>
    
    <div class="grid-inv">
        <div class="item" id="kvikklunsj" onclick="leggTilItem('Kvikklunsj', this)"
            >Kvikklunsj<span class="tooltiptext"><p>Kvikklunsj er digg sjokkis med kjeks som knaser godt i tanna.</p><p>10+ HP -5 Stamina</p></span>
        </div>
        <div class="item" id="vannflaske" onclick="leggTilItem('Vannflaske', this)">Vannflaske</div>
        <div class="item" id="monsenbilde" onclick="leggTilItem('Bilde av Lars Monsen', this)">Bilde av Lars Monsen</div>        
        <div class="item" id="kartkompass" onclick="leggTilItem('Kart og kompass', this)">Kart og kompass</div>
        <div class="item" id="myggspray" onclick="leggTilItem('Myggspray', this)">Myggspray</div>
        <div class="item" id="sovepose" onclick="leggTilItem('Sovepose', this)">Sovepose</div>
        <div class="item" id="telt" onclick="leggTilItem('Telt', this)">Telt</div>
        <div class="item" id="solkrem" onclick="leggTilItem('Solkrem', this)">Solkrem</div>
        <div class="item" id="førstehjelp" onclick="leggTilItem('Førstehjelp', this)">Førstehjelp</div>
        <div class="item" id="lommelykt" onclick="leggTilItem('Lommelykt', this)">Lommelykt</div>
        <div class="item" id="batteri" onclick="leggTilItem('Batteri', this)">Batteri</div>
        <div class="item" id="lighter" onclick="leggTilItem('Lighter', this)">Lighter</div>
        <div class="item" id="ved" onclick="leggTilItem('Ved', this)">Ved</div>
        <div class="item" id="kniv" onclick="leggTilItem('Kniv', this)">Kniv</div>
        <div class="item" id="grillspyd" onclick="leggTilItem('Grillspyd', this)">Grillspyd</div>
        <div class="item" id="sko" onclick="leggTilItem('Ekstra sko', this)">Ekstra sko</div>

    </div>

<script src="script.js"></script>

    let plass = 0;

</script> -->


</body>
</html>
